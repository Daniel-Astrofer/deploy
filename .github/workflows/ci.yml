name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
    with:
      component: deploy

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_architecture_guardrails.sh

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@13ca0b7eb3992aab286019e398f1fc7dbaee8f8a
