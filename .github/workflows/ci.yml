name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      component: deploy

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash infra/scripts/check_architecture_guardrails.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run progressive chain readiness smoke tests
        run: bash infra/tests/progressive-chain-readiness-test.sh

  kerosene-stack:
    name: Kerosene Stack release-lock contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate safe Cell release planning
        run: |
          bash infra/tests/kerosene-stack-test.sh
          bash infra/tests/kerosene-stack-evidence-test.sh
          python3 infra/tests/stack-archive-test.py
          python3 infra/tests/stack-lifecycle-test.py
          bash infra/tests/staging-snapshot-workflow-test.sh

  release-governance:
    name: Ordered release governance with four real validators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: go1.26.5
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify application and proof checks under the race detector
        working-directory: infra/governance
        run: go test -race ./...
      - name: Prove quorum loss and recovery with real CometBFT processes
        run: bash infra/governance/testnet-test.sh

  spiffe-admission:
    name: SPIFFE admission impersonation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deploy revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          version: v0.27.0
          kubectl_version: v1.32.3
      - name: Prove SPIFFE impersonation attacks are denied in-cluster
        run: bash infra/kubernetes/tests/staging-spire-admission-kind-test.sh

  infrastructure:
    name: Kubernetes manifests and rollout gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.33.0
      - name: Run deployment and SPIRE manifest gates
        run: |
          bash infra/kubernetes/tests/staging-canonical-runtime-test.sh
          bash infra/kubernetes/tests/staging-live-image-digest-test.sh
          bash infra/kubernetes/tests/staging-volumesnapshot-attestation-request-test.sh
          bash infra/kubernetes/tests/staging-spire-manifests-test.sh
          bash infra/kubernetes/tests/staging-spire-preflight-test.sh

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
