name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      component: deploy

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash infra/scripts/check_architecture_guardrails.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run progressive chain readiness smoke tests
        run: bash infra/tests/progressive-chain-readiness-test.sh

  infrastructure:
    name: Kubernetes manifests and rollout gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.33.0
      - name: Run deployment and SPIRE manifest gates
        run: bash infra/test.sh

  security:
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
