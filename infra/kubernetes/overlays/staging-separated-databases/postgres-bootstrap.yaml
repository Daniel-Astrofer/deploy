apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kerosene-postgres-bootstrap
                  key: bootstrap-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-postgres-bootstrap
                  key: bootstrap-password
