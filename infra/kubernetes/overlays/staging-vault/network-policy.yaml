apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-through-tor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-tor
      ports:
        - protocol: TCP
          port: 7801
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-tor
      ports:
        - protocol: TCP
          port: 9050
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tor-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-tor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 9050
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
