apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-tor-config
data:
  torrc: |
    SocksPort 0.0.0.0:9050
    HiddenServiceDir /var/lib/tor/vault/
    HiddenServiceVersion 3
    HiddenServicePort 7801 vault:7801
    Log notice stdout
    DataDirectory /var/lib/tor
---
apiVersion: v1
kind: Service
metadata:
  name: tor
spec:
  selector:
    app.kubernetes.io/name: vault-tor
  ports:
    - name: socks
      port: 9050
      targetPort: socks
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault-tor
spec:
  serviceName: tor
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-tor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-tor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tor
          image: kerosene/tor:staging
          command: [tor, -f, /etc/tor/torrc]
          ports:
            - name: socks
              containerPort: 9050
          readinessProbe:
            exec:
              command: [sh, -c, "test -s /var/lib/tor/vault/hostname"]
          volumeMounts:
            - name: config
              mountPath: /etc/tor/torrc
              subPath: torrc
              readOnly: true
            - name: data
              mountPath: /var/lib/tor
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: vault-tor-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
