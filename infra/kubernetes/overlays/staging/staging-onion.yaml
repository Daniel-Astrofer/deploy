apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-tor-config
data:
  torrc: |
    SocksPort 0.0.0.0:9050
    HiddenServiceDir /var/lib/tor/kerosene_service/
    HiddenServiceVersion 3
    HiddenServicePort 80 web-page:8080
    Log notice stdout
    DataDirectory /var/lib/tor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-tor
  labels:
    app.kubernetes.io/name: tor-onion
    app.kubernetes.io/component: tor
spec:
  serviceName: tor-onion
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tor-onion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor-onion
        app.kubernetes.io/component: tor
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tor
          image: kerosene/tor:staging
          imagePullPolicy: IfNotPresent
          command: ["tor", "-f", "/etc/tor/torrc"]
          ports:
            - name: socks
              containerPort: 9050
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -s /var/lib/tor/kerosene_service/hostname
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tor/torrc
              subPath: torrc
              readOnly: true
            - name: data
              mountPath: /var/lib/tor
      volumes:
        - name: config
          configMap:
            name: staging-tor-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tor-onion
  labels:
    app.kubernetes.io/name: tor-onion
spec:
  selector:
    app.kubernetes.io/name: tor-onion
  ports:
    - name: socks
      port: 9050
      targetPort: socks
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-tor-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tor-onion
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
