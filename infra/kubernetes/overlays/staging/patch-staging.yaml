apiVersion: apps/v1
kind: Deployment
metadata:
  name: kfe-service
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: kfe-service
          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:classpath:kfe-service-defaults.properties,classpath:kfe-service-vaultmesh-go-live.properties
            - name: KFE_VAULTMESH_ENABLED
              value: "true"
            - name: KFE_VAULTMESH_MESH_ONLY
              value: "true"
            - name: KFE_MPC_SIGNING_ENABLED
              value: "false"
            - name: KFE_VAULTMESH_BASE_URL
              value: https://vault-1:7801
            - name: KFE_VAULTMESH_URLS
              value: https://vault-1:7801,https://vault-2:7801,https://vault-3:7801
            - name: KFE_VAULTMESH_TLS_ENABLED
              value: "true"
            - name: KFE_VAULTMESH_REQUIRE_MTLS
              value: "true"
            - name: KFE_VAULTMESH_TLS_CERT_PATH
              value: /etc/kerosene/vault-mtls/vault-client.crt
            - name: KFE_VAULTMESH_TLS_KEY_PATH
              value: /etc/kerosene/vault-mtls/vault-client.pkcs8.key
            - name: KFE_VAULTMESH_TLS_CA_PATH
              value: /etc/kerosene/vault-mtls/ca.crt
            - name: KFE_VAULTMESH_TLS_HOSTNAME_VERIFICATION
              value: "true"
            - name: KFE_VAULTMESH_DAY_ROTATION_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: jwt-secret
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: password-pepper
            - name: KFE_COLUMN_CRYPTO_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: kfe-column-crypto-key
          volumeMounts:
            - name: vault-mtls-client
              mountPath: /etc/kerosene/vault-mtls
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: vault-mtls-client
          secret:
            secretName: kfe-vault-mtls-certs
            defaultMode: 0400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: server
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: jwt-secret
            - name: API_SECRET_AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: aes-secret
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: password-pepper
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kfe-service
spec:
  minReplicas: 2
  maxReplicas: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server
spec:
  minReplicas: 2
  maxReplicas: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kfe-service
spec:
  minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server
spec:
  minAvailable: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
data:
  SPRING_PROFILES_ACTIVE: "staging"
  # KFE is the single Flyway owner for the shared financial schema.
  FLYWAY_ENABLED: "false"
  BITCOIN_NETWORK: "testnet3"
  REGION: "STAGING"
  AUDIT_SOLVENCY_ENFORCED: "true"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfe-service-config
data:
  SPRING_PROFILES_ACTIVE: "staging,kfe"
  KEROSENE_RUNTIME_ROLE: "kfe-service"
  BITCOIN_NETWORK: "testnet3"
  REGION: "STAGING"
  AUDIT_SOLVENCY_ENFORCED: "true"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
