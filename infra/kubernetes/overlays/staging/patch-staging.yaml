apiVersion: apps/v1
kind: Deployment
metadata:
  name: kfe-service
spec:
  replicas: 1
  template:
    spec:
      volumes:
        - name: vault-mtls-client
          secret:
            secretName: kfe-vault-mtls-certs
            optional: true
            defaultMode: 0400
        - name: node-mtls-client
          secret:
            secretName: kerosene-node-mtls
            defaultMode: 0440
      containers:
        - name: kfe-service
          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:classpath:kfe-service-defaults.properties,classpath:kfe-service-vaultmesh-go-live.properties
            - name: KFE_VAULTMESH_ENABLED
              value: "false"
            - name: KFE_VAULTMESH_MESH_ONLY
              value: "false"
            - name: KFE_MPC_SIGNING_ENABLED
              value: "false"
            # Enabled only after authenticated discovery supplies one or more
            # stable onion endpoints. Never put Kubernetes Service DNS here.
            - name: KFE_VAULTMESH_TRANSPORT
              value: tor
            - name: KFE_VAULTMESH_SOCKS_HOST
              value: tor-onion
            - name: KFE_VAULTMESH_SOCKS_PORT
              value: "9050"
            - name: KFE_VAULTMESH_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: vault-discovery
                  key: coordinator-url
                  optional: true
            - name: KFE_VAULTMESH_URLS
              valueFrom:
                secretKeyRef:
                  name: vault-discovery
                  key: vault-urls
                  optional: true
            - name: KFE_VAULTMESH_TLS_ENABLED
              value: "true"
            - name: KFE_VAULTMESH_REQUIRE_MTLS
              value: "true"
            - name: KFE_VAULTMESH_TLS_CERT_PATH
              value: /etc/kerosene/vault-mtls/vault-client.crt
            - name: KFE_VAULTMESH_TLS_KEY_PATH
              value: /etc/kerosene/vault-mtls/vault-client.pkcs8.key
            - name: KFE_VAULTMESH_TLS_CA_PATH
              value: /etc/kerosene/vault-mtls/ca.crt
            - name: KFE_VAULTMESH_TLS_HOSTNAME_VERIFICATION
              value: "true"
            - name: KFE_VAULTMESH_DAY_ROTATION_ENABLED
              value: "false"
            - name: KFE_KEROSENE_NODE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vault-node-directory
                  key: enabled
            - name: KFE_KEROSENE_NODE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vault-node-directory
                  key: node-url
            - name: KFE_KEROSENE_NODE_NETWORK_ID
              value: kerosene-staging
            - name: KFE_KEROSENE_NODE_TRANSPORT
              value: tor
            - name: KFE_KEROSENE_NODE_SOCKS_HOST
              value: tor-onion
            - name: KFE_KEROSENE_NODE_SOCKS_PORT
              value: "9050"
            - name: KFE_KEROSENE_NODE_TLS_CERT_PATH
              value: /etc/kerosene/node-mtls/client.crt
            - name: KFE_KEROSENE_NODE_TLS_KEY_PATH
              value: /etc/kerosene/node-mtls/client.pkcs8.key
            - name: KFE_KEROSENE_NODE_TLS_CA_PATH
              value: /etc/kerosene/node-mtls/ca.crt
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: jwt-secret
            - name: API_SECRET_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: jwt-secret
            - name: KFE_STANDALONE
              value: "true"
            - name: KFE_AUTH_JWT_ISSUER
              value: "Kerosene-Auth"
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: password-pepper
            - name: KFE_COLUMN_CRYPTO_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: kfe-column-crypto-key
          volumeMounts:
            - name: vault-mtls-client
              mountPath: /etc/kerosene/vault-mtls
              readOnly: true
            - name: node-mtls-client
              mountPath: /etc/kerosene/node-mtls
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: server
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: jwt-secret
            - name: API_SECRET_AES_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: aes-secret
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: password-pepper
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kfe-service
spec:
  minReplicas: 1
  maxReplicas: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server
spec:
  minReplicas: 1
  maxReplicas: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kfe-service
spec:
  minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server
spec:
  minAvailable: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
data:
  SPRING_PROFILES_ACTIVE: "staging"
  # KFE is the single Flyway owner for the shared financial schema.
  FLYWAY_ENABLED: "false"
  BITCOIN_NETWORK: "testnet3"
  REGION: "STAGING"
  AUDIT_SOLVENCY_ENFORCED: "true"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfe-service-config
data:
  SPRING_PROFILES_ACTIVE: "staging,kfe,dev"
  KEROSENE_RUNTIME_ROLE: "kfe-service"
  BITCOIN_NETWORK: "testnet3"
  REGION: "STAGING"
  AUDIT_SOLVENCY_ENFORCED: "true"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
  # An authenticated discovery controller may override this through the
  # optional vault-discovery Secret mounted as explicit environment entries.
  KFE_VAULTMESH_ENABLED: "false"
