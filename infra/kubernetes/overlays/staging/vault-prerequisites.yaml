apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-tor-config
data:
  README: |
    Staging currently uses VAULT_TRANSPORT=clearnet inside the private cluster.
    External production vaults must use their independently provisioned Tor config.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-1-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-2-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-3-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
