apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-tor-config
data:
  README: |
    Vault traffic is Tor-only. A Vault runs from the independent staging-vault
    overlay and publishes a stable onion identity provisioned outside Git.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-node-directory
data:
  # Enable only after a Vault-plane Node has accepted a quorum-signed
  # MembershipManifest and its onion URL is known.
  enabled: "false"
  node-url: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-1-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-2-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-3-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
