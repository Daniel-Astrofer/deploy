  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
  SPRING_DATA_REDIS_HOST: kerosene-redis-headless
  SPRING_DATA_REDIS_PORT: '6379'
  LIGHTNING_LND_HOST: kerosene-lnd-headless
  LIGHTNING_LND_PORT: '10009'
  BITCOIN_NETWORK: testnet3
  BITCOIN_RPC_ENABLED: 'true'
  BITCOIN_RPC_REQUIRED: 'true'
  BITCOIN_RPC_PRUNED_REQUIRED: 'true'
  BITCOIN_RPC_URL: http://bitcoin-core:18332
  BITCOIN_ZMQ_ENABLED: 'true'
  BITCOIN_ZMQ_RAWTX: tcp://bitcoin-core:28332
  BITCOIN_ZMQ_HASHBLOCK: tcp://bitcoin-core:28333
  REGION: PROD
  AUDIT_SOLVENCY_ENFORCED: 'true'
  RELEASE_ATTESTATION_REQUIRED: 'true'
  RELEASE_REMOTE_ATTESTATION_ENABLED: 'true'
  KFE_REMOTE_BASE_URL: https://kfe-service:8443
  KFE_REMOTE_WALLET_PROVISIONING_ENABLED: 'true'
  APP_CORS_ALLOWED_ORIGINS: http://u3hrcmbbd5lqnkffqub5qzdaihoutztgh3rtrtrtrcv2bget6btnpdad.onion
  BITCOIN_RPC_WALLET: kerosene
  WEBAUTHN_ORIGINS: http://u3hrcmbbd5lqnkffqub5qzdaihoutztgh3rtrtrtrcv2bget6btnpdad.onion
  SPRING_FLYWAY_ENABLED: 'true'
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  QUORUM_ALLOW_LOCAL_SIMULATION: 'false'
  LIGHTNING_LND_TLS_INSECURE: 'false'
  LIGHTNING_LND_ENABLED: 'false'
  LIGHTNING_LND_REST_ENABLED: 'false'
  TRANSACTIONS_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: 'false'
  KFE_RECEIVE_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: 'false'
  BITCOIN_PLATFORM_MASTER_XPUB: ''
  QUORUM_SHARD_URLS: ''
  QUORUM_PSBT_SIGNER_URLS: ''
  QUORUM_PSBT_SIGNER_IDS: ''
