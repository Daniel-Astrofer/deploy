  TRANSACTIONS_LIGHTNING_PAYMENT_PROVIDER: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: server
        env:
        - name: KFE_INTERNAL_SHARED_SECRET
          $patch: delete
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: auth-database
              key: jdbc-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: auth-database
              key: application-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-database
              key: application-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-jwt-signing
              key: JWT_SECRET
        envFrom:
        - configMapRef:
            name: server-config
        - secretRef:
            name: auth-crypto
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        volumeMounts: []
      volumes: []
    metadata:
      annotations:
        kerosene.io/release-digest: sha256:d9bcb539f5ff186b96662f2e5ab44a3de85367b6fb3527fa86107c194ddf25ab
  strategy:
    $patch: replace
    type: Recreate
  revisionHistoryLimit: 0
---
