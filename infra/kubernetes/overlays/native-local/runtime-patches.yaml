  KFE_VAULTMESH_REQUIRE_MTLS: 'true'
  KFE_VAULTMESH_TLS_ENABLED: 'true'
  SPRING_FLYWAY_DEFAULT_SCHEMA: auth
  SPRING_FLYWAY_SCHEMAS: auth,public
  KFE_INTERNAL_BASE_URL: https://kfe-service:8443
  TOR_PROXY_HOST: 172.18.0.1
  TOR_PROXY_PORT: '9050'
  RELEASE_SERVICE_NAME: auth
  RELEASE_MANIFEST_PATH: /release/release-manifest.json
  RELEASE_MANIFEST_SIGNATURE_PATH: /release/release-manifest.sig
  RELEASE_MANIFEST_PUBLIC_KEY_PATH: /release/release-public-key.der.b64
  GIT_COMMIT: 3848b85355ef310a4ed88341c7156968a971d507
  IMAGE_DIGEST: sha256:091695ebbf659a16d8ee74d30e03ab8a785f499acc0a4649c6ac8fce8ad69d03
  CODE_HASH: sha256:0639b22ef08aec4af46adc5cce497a6ec7e44f0264da09b8ffc661fa1f235130
  CONFIG_HASH: sha256:e8ef4d661ed6a22470ec8bc40faf6adf6caf2b967bf8f7add5bdfa2bba39390d
  KFE_VAULTMESH_MESH_ONLY: 'true'
  KFE_VAULTMESH_ENABLED: 'true'
  KFE_MPC_SIGNING_ENABLED: 'false'
  TRANSACTIONS_RAILS_LIGHTNING_INVOICE_PROVIDER: disabled
  TRANSACTIONS_RAILS_LIGHTNING_PAYMENT_PROVIDER: disabled
  TOR_HEALTH_REQUIRED: 'true'
  TOR_HEALTH_SOCKS_HOST: 172.18.0.1
  TOR_HEALTH_SOCKS_PORT: '9050'
  TICKER_PROXY_SOCKS_HOST: 172.18.0.1
  TICKER_PROXY_SOCKS_PORT: '9050'
  KFE_REMOTE_HEALTH_BASE_URL: https://kfe-health:8443
