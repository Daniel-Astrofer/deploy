apiVersion: apps/v1
kind: Deployment
metadata:
  name: kfe-service
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: kfe-service
        env:
        - name: KFE_INTERNAL_SHARED_SECRET
          $patch: delete
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: kfe-database
              key: jdbc-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: kfe-database
              key: application-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kfe-database
              key: application-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-jwt-signing
              key: JWT_SECRET
        - name: KFE_FEE_QUOTE_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: kfe-service-secrets
              key: fee-quote-signing-secret
        - name: KFE_COLUMN_CRYPTO_KEY_BASE64
          valueFrom:
            secretKeyRef:
              name: kfe-service-secrets
              key: KFE_COLUMN_CRYPTO_KEY_BASE64
        envFrom:
        - configMapRef:
            name: kfe-service-config
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        volumeMounts:
        - name: vault-client-mtls
          mountPath: /etc/vault-mtls
          readOnly: true
        - name: ledger-checkpoint
          mountPath: /etc/kfe-ledger
          readOnly: true
      volumes:
      - name: vault-client-mtls
        secret:
          secretName: vault-client-mtls
          defaultMode: 288
      - name: ledger-checkpoint
        secret:
          secretName: kfe-ledger-checkpoint
          defaultMode: 288
    metadata:
      annotations:
        kerosene.io/release-digest: sha256:d9bcb539f5ff186b96662f2e5ab44a3de85367b6fb3527fa86107c194ddf25ab
  strategy:
    $patch: replace
    type: Recreate
  revisionHistoryLimit: 0
---
