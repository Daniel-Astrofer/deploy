apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
  labels:
    app.kubernetes.io/name: server
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: '8080'
  KEROSENE_RUNTIME_ROLE: core-service
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
