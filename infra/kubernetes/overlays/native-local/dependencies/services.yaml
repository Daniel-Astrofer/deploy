spec:
  ports:
  - name: tcp-5432
    port: 5432
    targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kerosene-db-headless-native
  labels:
    kubernetes.io/service-name: kerosene-db-headless
    endpointslice.kubernetes.io/managed-by: kerosene-native
addressType: IPv4
ports:
- name: tcp-5432
  port: 5432
  protocol: TCP
endpoints:
- addresses:
  - 172.18.0.20
  conditions:
    ready: true
---
