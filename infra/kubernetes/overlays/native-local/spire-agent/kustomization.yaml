apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../components/spire/agent
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: spire-agent
        namespace: spire-system
      spec:
        template:
          spec:
            volumes:
              - name: kubelet-ca
                configMap:
                  name: native-kubelet-serving-ca
