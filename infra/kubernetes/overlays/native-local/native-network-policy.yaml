apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-docker-dependencies
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - server
      - kfe-service
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 172.18.0.20/32
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - ipBlock:
        cidr: 172.18.0.1/32
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 18332
    - protocol: TCP
      port: 28332
    - protocol: TCP
      port: 28333
    - protocol: TCP
      port: 9050
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: native-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-page
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 172.18.0.1/32
    - ipBlock:
        cidr: 192.168.3.100/32
    ports:
    - protocol: TCP
      port: 8080
