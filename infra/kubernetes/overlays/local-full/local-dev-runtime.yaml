apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-postgres-data
  labels:
    app: kerosene-db-patroni
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  capacity:
    storage: 4Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kerosene-local
  hostPath:
    path: /home/omega/Kerosene/.local/postgres-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-postgres-data
  labels:
    app: kerosene-db-patroni
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: kerosene-local
  volumeName: local-postgres-data
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: local-postgres
  labels:
    app: kerosene-db-patroni
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  serviceName: kerosene-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: kerosene-db-patroni
  template:
    metadata:
      labels:
        app: kerosene-db-patroni
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: kerosene
        kerosene.io/local-dependency: "true"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-postgres-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 70:70 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
            - name: patroni
              containerPort: 8008
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: kerosene
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kerosene-db-secrets
                  key: application-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-db-secrets
                  key: application-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kerosene", "-d", "kerosene"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kerosene", "-d", "kerosene"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 3Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: local-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-redis
  labels:
    app: kerosene-redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kerosene-redis
  template:
    metadata:
      labels:
        app: kerosene-redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: kerosene
        kerosene.io/local-dependency: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            # appendonly off for local-full: AOF on small kind disks caused ENOSPC/CrashLoop.
            # disable RDB snapshots + stop-writes-on-bgsave-error so a full kind /var disk
            # does not put Redis into MISCONF and 500 the API on every INCR (rate-limit).
            # Sessions are ephemeral; beta smokes recreate auth state after redis restart.
            - exec redis-server --appendonly no --save "" --stop-writes-on-bgsave-error no --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
            - name: sentinel
              containerPort: 26379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-redis-secrets
                  key: redis-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir:
            sizeLimit: 512Mi
---
# HashiCorp Vault (wallet-arming / raft) removed from local-full deploy.
# Treasury settlement uses kerosene-vault mesh via vault-mesh-lab.compose.yaml.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-bitcoin-data
  labels:
    app: kerosene-bitcoin
    app.kubernetes.io/name: bitcoin-core
    app.kubernetes.io/component: bitcoin
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  capacity:
    # Full classic testnet / testnet3 (and room to grow). Data lives on external HDD via bind-mount
    # onto this hostPath — see scripts/migrate-chain-storage-to-hdd.sh
    storage: 400Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kerosene-local
  hostPath:
    path: /home/astrofer/Kerosene/.local/bitcoin-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-bitcoin-data
  labels:
    app: kerosene-bitcoin
    app.kubernetes.io/name: bitcoin-core
    app.kubernetes.io/component: bitcoin
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: kerosene-local
  # Bind the static hostPath PV explicitly (Retain reclaim leaves PV Released
  # after PVC delete; volumeName avoids waiting on a missing StorageClass).
  volumeName: local-bitcoin-data
  resources:
    requests:
      storage: 400Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-bitcoin
  labels:
    app: kerosene-bitcoin
    app.kubernetes.io/name: bitcoin-core
    app.kubernetes.io/component: bitcoin
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  replicas: 1
  strategy:
    # Bitcoin Core needs an exclusive lock on the datadir.
    # Recreate avoids concurrent pods during rollout that would contend for the same PVC.
    type: Recreate
  selector:
    matchLabels:
      app: kerosene-bitcoin
  template:
    metadata:
      labels:
        app: kerosene-bitcoin
        app.kubernetes.io/name: bitcoin-core
        app.kubernetes.io/component: bitcoin
        app.kubernetes.io/part-of: kerosene
        kerosene.io/local-dependency: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitcoind
          image: bitcoin/bitcoin:28.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              bitcoin_dir="${BITCOIN_DATA_DIR:-/home/bitcoin/.bitcoin}"
              wallet="${BITCOIN_RPC_WALLET:-kerosene}"
              rpc_port="${BITCOIN_RPC_PORT:-8332}"
              p2p_port="${BITCOIN_P2P_PORT:-8333}"

              mkdir -p "$bitcoin_dir"

              bitcoin_cli() {
                bitcoin-cli -testnet \
                  -datadir="$bitcoin_dir" \
                  -rpcport="$rpc_port" \
                  -rpcuser="$BITCOIN_RPC_USER" \
                  -rpcpassword="$BITCOIN_RPC_PASSWORD" \
                  "$@"
              }

              # Steady-state: pruned classic testnet (no txindex). For faster initial
              # sync, run: bash infra/kubernetes/scripts/bitcoin-ibd-mode.sh boost
              # which scales down app pods and raises dbcache/CPU/RAM temporarily.
              bitcoind \
                -testnet \
                -datadir="$bitcoin_dir" \
                -server=1 \
                -printtoconsole \
                -prune=10000 \
                -txindex=0 \
                -rpcbind=0.0.0.0 \
                -rpcallowip=0.0.0.0/0 \
                -rpcport="$rpc_port" \
                -port="$p2p_port" \
                -rpcuser="$BITCOIN_RPC_USER" \
                -rpcpassword="$BITCOIN_RPC_PASSWORD" \
                -zmqpubrawtx=tcp://0.0.0.0:28332 \
                -zmqpubhashblock=tcp://0.0.0.0:28333 \
                -zmqpubrawblock=tcp://0.0.0.0:28334 &
              pid="$!"

              stop_bitcoind() {
                bitcoin_cli stop >/dev/null 2>&1 || true
                wait "$pid" || true
              }
              trap stop_bitcoind INT TERM

              bitcoin_cli -rpcwait getblockchaininfo >/dev/null

              if ! bitcoin_cli listwallets | grep -F "\"$wallet\"" >/dev/null 2>&1; then
                if bitcoin_cli listwalletdir | grep -F "\"name\": \"$wallet\"" >/dev/null 2>&1; then
                  bitcoin_cli loadwallet "$wallet" >/dev/null
                else
                  bitcoin_cli createwallet "$wallet" false false "${BITCOIN_WALLET_PASSPHRASE:-}" false true true >/dev/null
                fi
              fi

              bitcoin_cli -rpcwallet="$wallet" getwalletinfo >/dev/null

              wait "$pid"
          env:
            - name: BITCOIN_DATA_DIR
              value: /home/bitcoin/.bitcoin
            - name: BITCOIN_RPC_WALLET
              value: kerosene
            - name: BITCOIN_RPC_PORT
              value: "8332"
            - name: BITCOIN_P2P_PORT
              value: "8333"
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-user
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-password
          ports:
            - name: rpc
              containerPort: 8332
              protocol: TCP
            - name: p2p
              containerPort: 8333
              protocol: TCP
            - name: zmq-block
              containerPort: 28332
              protocol: TCP
            - name: zmq-tx
              containerPort: 28333
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  wallet="${BITCOIN_RPC_WALLET:-kerosene}"
                  bitcoin-cli -testnet \
                    -datadir="${BITCOIN_DATA_DIR:-/home/bitcoin/.bitcoin}" \
                    -rpcport="${BITCOIN_RPC_PORT:-8332}" \
                    -rpcuser="$BITCOIN_RPC_USER" \
                    -rpcpassword="$BITCOIN_RPC_PASSWORD" \
                    -rpcwallet="$wallet" getwalletinfo >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bitcoin-data
              mountPath: /home/bitcoin/.bitcoin
      volumes:
        - name: bitcoin-data
          persistentVolumeClaim:
            claimName: local-bitcoin-data
---
