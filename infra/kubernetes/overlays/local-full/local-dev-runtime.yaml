apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-lnd
  labels:
    app: kerosene-lnd
    app.kubernetes.io/name: lnd
    app.kubernetes.io/component: lightning
    app.kubernetes.io/part-of: kerosene
    kerosene.io/local-dependency: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kerosene-lnd
  template:
    metadata:
      labels:
        app: kerosene-lnd
        app.kubernetes.io/name: lnd
        app.kubernetes.io/component: lightning
        app.kubernetes.io/part-of: kerosene
        kerosene.io/local-dependency: "true"
    spec:
      # LND image expects writable datadir under /root/.lnd (local-only).
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-lnd-data-perms
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chmod -R a+rwx /root/.lnd || true"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: lnd-data
              mountPath: /root/.lnd
        - name: wait-bitcoin-rpc
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              deadline=$(( $(date +%s) + ${BITCOIN_RPC_WAIT_TIMEOUT_SECONDS:-180} ))
              payload='{"jsonrpc":"1.0","id":"lnd-wait","method":"getblockchaininfo","params":[]}'
              while :; do
                resp="$(curl -sS --max-time 2 --fail \
                  -u "${BITCOIN_RPC_USER}:${BITCOIN_RPC_PASSWORD}" \
                  -H "Content-Type: application/json" \
                  --data "$payload" \
                  "http://${BITCOIN_RPC_HOST}:${BITCOIN_RPC_PORT}/" 2>/dev/null || true)"

                if echo "$resp" | grep -Eq '"initialblockdownload"[[:space:]]*:[[:space:]]*false'; then
                  echo "bitcoin-core RPC ready (initialblockdownload=false)"
                  exit 0
                fi

                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Timed out waiting for bitcoin-core RPC readiness" >&2
                  exit 1
                fi

                sleep 2
              done
          env:
            - name: BITCOIN_RPC_HOST
              value: bitcoin-core
            - name: BITCOIN_RPC_PORT
              value: "8332"
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-user
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-password
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: lnd
          image: lightninglabs/lnd:v0.20.1-beta
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              lnd_dir="${LND_DATA_DIR:-/root/.lnd}"
              mkdir -p "$lnd_dir"
              # Regenerate TLS when SANs change so REST hostname matches Service DNS.
              san_marker="${lnd_dir}/.kerosene-tls-san"
              san_config="domains=${LND_TLS_EXTRA_DOMAINS};ips=${LND_TLS_EXTRA_IPS}"
              if [ -f "${lnd_dir}/tls.cert" ] || [ -f "${lnd_dir}/tls.key" ]; then
                previous="$(cat "$san_marker" 2>/dev/null || true)"
                if [ "$previous" != "$san_config" ]; then
                  rm -f "${lnd_dir}/tls.cert" "${lnd_dir}/tls.key"
                fi
              fi
              printf '%s\n' "$san_config" > "$san_marker"

              set -- lnd \
                "--lnddir=${lnd_dir}" \
                "--rpclisten=0.0.0.0:10009" \
                "--restlisten=0.0.0.0:8080" \
                "--listen=0.0.0.0:9735" \
                "--bitcoin.active" \
                "--bitcoin.testnet" \
                "--bitcoin.node=bitcoind" \
                "--bitcoind.rpchost=${BITCOIN_RPC_HOST}:${BITCOIN_RPC_PORT}" \
                "--bitcoind.rpcuser=${BITCOIN_RPC_USER}" \
                "--bitcoind.rpcpass=${BITCOIN_RPC_PASSWORD}" \
                "--bitcoind.zmqpubrawblock=${BITCOIN_ZMQ_RAWBLOCK}" \
                "--bitcoind.zmqpubrawtx=${BITCOIN_ZMQ_RAWTX}" \
                "--alias=${LND_ALIAS}" \
                "--color=${LND_COLOR}" \
                "--accept-keysend" \
                "--accept-amp" \
                "--bitcoin.defaultchanconfs=1" \
                "--maxpendingchannels=10" \

              old_ifs=$IFS
              IFS=','
              for domain in ${LND_TLS_EXTRA_DOMAINS}; do
                [ -n "$domain" ] && set -- "$@" "--tlsextradomain=${domain}"
              done
              for ip in ${LND_TLS_EXTRA_IPS}; do
                [ -n "$ip" ] && set -- "$@" "--tlsextraip=${ip}"
              done
              IFS=$old_ifs
              exec "$@"
          env:
            - name: LND_DATA_DIR
              value: /root/.lnd
            - name: LND_ALIAS
              value: kerosene-local-lnd
            - name: LND_COLOR
              value: "#D1495B"
            - name: LND_TLS_EXTRA_DOMAINS
              value: "kerosene-lnd-headless,local-lnd,localhost,lnd-bitcoind"
            - name: LND_TLS_EXTRA_IPS
              value: "127.0.0.1"
            - name: BITCOIN_RPC_HOST
              value: bitcoin-core
            - name: BITCOIN_RPC_PORT
              value: "8332"
            - name: BITCOIN_ZMQ_RAWBLOCK
              value: "tcp://bitcoin-core:28332"
            - name: BITCOIN_ZMQ_RAWTX
              value: "tcp://bitcoin-core:28333"
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-user
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-bitcoin-secrets
                  key: rpc-password
          ports:
            - name: grpc
              containerPort: 10009
              protocol: TCP
            - name: rest
              containerPort: 8080
              protocol: TCP
            - name: p2p
              containerPort: 9735
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  test -f /root/.lnd/tls.cert && \
                  test -f /root/.lnd/data/chain/bitcoin/testnet/admin.macaroon && \
                  lncli --lnddir=/root/.lnd --network=testnet --rpcserver=127.0.0.1:10009 getinfo >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 36
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "DAC_OVERRIDE", "CHOWN", "FOWNER"]
          volumeMounts:
            - name: lnd-data
              mountPath: /root/.lnd
        - name: lnd-bootstrap
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              lnd_dir=/lnd
              network=testnet
              rest_port=8080
              host=127.0.0.1
              tls_cert="${lnd_dir}/tls.cert"
              macaroon_path="${lnd_dir}/data/chain/bitcoin/${network}/admin.macaroon"
              state_url="https://${host}:${rest_port}/v1/state"
              password_b64="$(printf '%s' "$LND_WALLET_PASSWORD" | base64 | tr -d '\n')"
              seed_backup="${lnd_dir}/kerosene-local-wallet-seed.json"

              echo "LND bootstrap waiting for TLS..."
              while [ ! -f "$tls_cert" ]; do sleep 2; done

              read_state() {
                curl -sk --connect-timeout 3 "$state_url" 2>/dev/null || true
              }

              unlock_wallet() {
                echo "Unlocking LND wallet..."
                curl -sk -X POST \
                  -H "Content-Type: application/json" \
                  -d "{\"wallet_password\":\"${password_b64}\"}" \
                  "https://${host}:${rest_port}/v1/unlockwallet" || true
              }

              bootstrap_once() {
                state_json="$(read_state)"
                case "$state_json" in
                  *NON_EXISTING*)
                    echo "Initializing LND wallet..."
                    seed_json="$(curl -sk -X GET "https://${host}:${rest_port}/v1/genseed")"
                    umask 077
                    printf '%s\n' "$seed_json" > "$seed_backup"
                    seed_payload="$(printf '%s' "$seed_json" | sed -n 's/.*"cipher_seed_mnemonic":[[:space:]]*\[\(.*\)\],[[:space:]]*"enciphered_seed".*/[\1]/p')"
                    if [ -z "$seed_payload" ]; then
                      seed_payload="$(printf '%s' "$seed_json" | tr -d '\n' | sed -n 's/.*"cipher_seed_mnemonic"[[:space:]]*:[[:space:]]*\[\([^]]*\)\].*/[\1]/p')"
                    fi
                    if [ -z "$seed_payload" ]; then
                      echo "Failed to parse seed mnemonic from genseed" >&2
                      echo "$seed_json" >&2
                      return 1
                    fi
                    curl -sk -X POST \
                      -H "Content-Type: application/json" \
                      -d "{\"wallet_password\":\"${password_b64}\",\"cipher_seed_mnemonic\":${seed_payload},\"recovery_window\":0}" \
                      "https://${host}:${rest_port}/v1/initwallet" >/dev/null
                    ;;
                  *LOCKED*|*WAITING_TO_START*)
                    # Existing wallet after pod restart: unlock (WAITING_TO_START often precedes LOCKED).
                    unlock_wallet
                    ;;
                  *SERVER_ACTIVE*|*RPC_ACTIVE*|*UNLOCKED*)
                    echo "LND wallet already active."
                    ;;
                  *)
                    echo "LND state: ${state_json:-unavailable}"
                    # If macaroon already exists, attempt unlock optimistically.
                    if [ -f "$macaroon_path" ]; then
                      unlock_wallet
                    fi
                    ;;
                esac
              }

              # First bootstrap aggressively, then watch for lock after restarts.
              for i in $(seq 1 120); do
                bootstrap_once || true
                state_json="$(read_state)"
                case "$state_json" in
                  *SERVER_ACTIVE*|*RPC_ACTIVE*)
                    if [ -f "$macaroon_path" ]; then
                      echo "LND wallet ready (macaroon present)."
                      break
                    fi
                    ;;
                esac
                sleep 2
              done

              if [ ! -f "$macaroon_path" ]; then
                echo "LND bootstrap timed out waiting for admin.macaroon" >&2
                # Keep running so the pod does not flapping-crash; retry unlock forever.
              fi

              if [ -f "$macaroon_path" ]; then
                od -An -tx1 "$macaroon_path" | tr -d ' \n' > "${lnd_dir}/admin.macaroon.hex" || true
                echo "Wrote ${lnd_dir}/admin.macaroon.hex"
              fi

              while true; do
                sleep 15
                bootstrap_once || true
              done
          env:
            - name: LND_WALLET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kerosene-lnd-secrets
                  key: wallet-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: lnd-data
              mountPath: /lnd
      volumes:
        - name: lnd-data
          persistentVolumeClaim:
            claimName: local-lnd-data
