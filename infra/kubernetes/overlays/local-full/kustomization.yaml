apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kerosene-local
resources:
  - ../../base
  - namespace.yaml
  - local-dev-secrets.yaml
  - local-dev-runtime.yaml
  - local-lnd-peer.yaml
  - local-network-policy.yaml
  - local-tor-onion.yaml
  - local-vault-mesh-host.yaml
  - web-page-nginx-config.yaml
  - web-page-runtime-config.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: local-full
images:
  - name: kerosene/kfe-service
    newName: localhost:5000/kerosene/kfe-service
    newTag: local
  - name: kerosene/server
    newName: localhost:5000/kerosene/server
    newTag: local
  - name: kerosene/web-page
    newName: localhost:5000/kerosene/web-page
    newTag: local
patches:
  - path: patch-local-full.yaml
