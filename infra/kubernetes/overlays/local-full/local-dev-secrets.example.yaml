# Example local-only development credentials (committed).
# Deploy/render copies this to gitignored local-dev-secrets.yaml when missing.
# Do not reuse these values outside the kerosene-local namespace or any shared environment.
apiVersion: v1
kind: Secret
metadata:
  name: kerosene-db-secrets
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    kerosene.io/local-only: "true"
type: Opaque
stringData:
  jdbc-url: jdbc:postgresql://kerosene-db-headless:5432/kerosene
  application-user: kerosene
  application-password: kerosene-local-password
  postgres-user: postgres
  postgres-password: postgres-local-password
---
apiVersion: v1
kind: Secret
metadata:
  name: kerosene-redis-secrets
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    kerosene.io/local-only: "true"
type: Opaque
stringData:
  redis-password: kerosene-local-redis
---
apiVersion: v1
kind: Secret
metadata:
  name: kerosene-bitcoin-secrets
  labels:
    app.kubernetes.io/name: bitcoin-core
    app.kubernetes.io/component: bitcoin
    kerosene.io/local-only: "true"
type: Opaque
stringData:
  rpc-user: kerosene
  rpc-password: kerosene-local-rpc
---
apiVersion: v1
kind: Secret
metadata:
  name: kerosene-lnd-secrets
  labels:
    app.kubernetes.io/name: lnd
    app.kubernetes.io/component: lightning
    kerosene.io/local-only: "true"
type: Opaque
stringData:
  # Replaced at runtime by scripts/enable-local-lnd.sh after wallet bootstrap (hex macaroon).
  admin-macaroon: local-lnd-pending-bootstrap
  wallet-password: kerosene-local-lnd-wallet
---
apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: server
    kerosene.io/local-only: "true"
type: Opaque
stringData:
  shard-attestation-secret: local-shard-attestation-not-for-production
  release-attestation-secret: local-release-attestation-not-for-production
  kfe-internal-shared-secret: local-kfe-internal-secret-not-for-production