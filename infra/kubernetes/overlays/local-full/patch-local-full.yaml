apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: server
          # kind load injects images into the node; Never avoids pull against
          # a non-existent localhost:5000 registry on the workstation cluster.
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kfe-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: kfe-service
          imagePullPolicy: Never
          volumeMounts:
            - name: vault-mesh-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: vault-mesh-certs
          secret:
            secretName: vault-client-mtls
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-page
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web-page
          imagePullPolicy: Never
          volumeMounts:
            - name: web-page-nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: web-page-runtime-config
              mountPath: /usr/share/nginx/html/kerosene-runtime-config.json
              subPath: kerosene-runtime-config.json
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
      volumes:
        - name: web-page-nginx-conf
          configMap:
            name: web-page-nginx-conf
        - name: web-page-runtime-config
          configMap:
            name: web-page-runtime-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kfe-service
spec:
  minReplicas: 1
  maxReplicas: 1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: server
spec:
  minReplicas: 1
  maxReplicas: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kfe-service
spec:
  minAvailable: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server
spec:
  minAvailable: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-page
spec:
  minAvailable: 0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config
data:
  SPRING_PROFILES_ACTIVE: "docker"
  # The local PostgreSQL volume predates the auth schema split. Let Hibernate
  # add missing compatibility tables in the lab; production remains validate-only.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SERVER_PORT: "8080"
  # The persisted lab DB contains legacy Flyway history from before the
  # auth/KFE schema split. Hibernate updates the lab schema; production keeps
  # Flyway validation enabled.
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_DATA_REDIS_HOST: "kerosene-redis-headless"
  SPRING_DATA_REDIS_PORT: "6379"
  TOR_HEALTH_REQUIRED: "false"
  LIGHTNING_LND_ENABLED: "true"
  LIGHTNING_LND_HOST: "kerosene-lnd-headless"
  LIGHTNING_LND_PORT: "10009"
  LIGHTNING_LND_TLS_ENABLED: "false"
  LIGHTNING_LND_TLS_INSECURE: "true"
  LIGHTNING_LND_REST_ENABLED: "true"
  LIGHTNING_LND_BASE_URL: "https://kerosene-lnd-headless:8080"
  BITCOIN_NETWORK: "testnet3"
  BITCOIN_RPC_ENABLED: "true"
  # Beta testnet: fail closed if Bitcoin Core is unreachable.
  BITCOIN_RPC_REQUIRED: "true"
  BITCOIN_RPC_PRUNED_REQUIRED: "false"
  BITCOIN_RPC_URL: "http://bitcoin-core:8332"
  BITCOIN_RPC_WALLET: "kerosene"
  TRANSACTIONS_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: "true"
  KFE_RECEIVE_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: "true"
  # Live local bitcoind publishes rawtx@28333 and rawblock@28332 until restarted with
  # local-dev-runtime hashblock/rawtx alignment. Keep endpoints matching the running node.
  BITCOIN_ZMQ_ENABLED: "true"
  BITCOIN_ZMQ_RAWTX: "tcp://bitcoin-core:28333"
  BITCOIN_ZMQ_HASHBLOCK: "tcp://bitcoin-core:28332"
  REGION: "LOCAL"
  APP_CORS_ALLOWED_ORIGINS: "http://placeholder.onion"
  WEBAUTHN_ORIGINS: "android:apk-key-hash:kerosene,http://placeholder.onion"
  AUDIT_SOLVENCY_ENFORCED: "false"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
  QUORUM_ALLOW_LOCAL_SIMULATION: "true"
  # Market prices via Tor SOCKS — server keeps no clearnet egress.
  TICKER_COINGECKO_ENABLED: "true"
  TICKER_PROXY_SOCKS_HOST: "tor-onion"
  TICKER_PROXY_SOCKS_PORT: "9050"
  # WARN: KFE_VAULTMESH_REQUIRE_MTLS=false is LOCAL-ONLY. Must be set to "true" or removed before promotion to staging/production.
  KFE_VAULTMESH_REQUIRE_MTLS: "false"
  KFE_VAULTMESH_TLS_ENABLED: "false"
  # Security material (local-only): in prod this must come from injected secrets.
  # Spring binds these env vars to:
  #   api.secret.aes.secret
  #   api.secret.token.secret
  #   api.secret.pepper.secret
  # Stable local key: changing it without re-encrypting existing rows makes
  # StringCryptoConverter reject every existing credential.
  AES_SECRET: "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
  API_SECRET_AES_SECRET: "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
  API_SECRET_TOKEN_SECRET: "kerosene-local-token-secret"
  API_SECRET_PEPPER_SECRET: "kerosene-local-pepper-secret"
  # OperationalHealthService.checkStorage requires this path to be an
  # existing readable+writeable directory. The server mounts /tmp as an
  # in-memory emptyDir by design.
  SHARD_IDENTITY_PATH: "/tmp"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kfe-service-config
data:
  SPRING_PROFILES_ACTIVE: "docker,kfe"
  SERVER_PORT: "8080"
  KEROSENE_RUNTIME_ROLE: "kfe-service"
  SPRING_DATA_REDIS_HOST: "kerosene-redis-headless"
  SPRING_DATA_REDIS_PORT: "6379"
  # The persisted local database may already contain later repair migrations
  # from before the KFE schema split. Apply missing local migrations out of
  # order; production keeps Flyway validation strict.
  FLYWAY_OUT_OF_ORDER: "true"
  SPRING_FLYWAY_OUT_OF_ORDER: "true"
  # The lab DB predates the KFE schema split; Hibernate compatibility update
  # is used locally while production keeps Flyway + validate-only JPA.
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:classpath:kfe-service-vaultmesh-testnet3.properties"
  # Vault mesh settlement (compose lab vault-1 via Service/Endpoints bridge).
  KFE_VAULTMESH_ENABLED: "true"
  KFE_VAULTMESH_MESH_ONLY: "true"
  KFE_VAULTMESH_SUBMIT_ON_OUTBOUND: "true"
  KFE_VAULTMESH_BASE_URL: "http://vault-1:7701"
  KFE_VAULTMESH_API_TOKEN: "kerosene-vault-lab-only"
  KFE_VAULTMESH_DAY_ROTATION_ENABLED: "true"
  # WARN: KFE_VAULTMESH_REQUIRE_MTLS=false is LOCAL-ONLY. Must be set to "true" or removed for staging/production.
  KFE_VAULTMESH_REQUIRE_MTLS: "false"
  KFE_MPC_SIGNING_ENABLED: "false"
  KFE_STANDALONE_MPC_DEV_KEYGEN_ENABLED: "false"
  # Column crypto key (local-only). Required by KFE StringColumnCryptoService.
  # In production this comes from a Kubernetes Secret.
  KFE_COLUMN_CRYPTO_KEY_BASE64: "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
  JWT_SECRET: "kerosene-local-jwt-secret-change-before-production-32-bytes"
  LIGHTNING_LND_ENABLED: "true"
  LIGHTNING_LND_HOST: "kerosene-lnd-headless"
  LIGHTNING_LND_PORT: "10009"
  LIGHTNING_LND_TLS_ENABLED: "false"
  LIGHTNING_LND_TLS_INSECURE: "true"
  LIGHTNING_LND_REST_ENABLED: "true"
  LIGHTNING_LND_BASE_URL: "https://kerosene-lnd-headless:8080"
  BITCOIN_NETWORK: "testnet3"
  BITCOIN_RPC_ENABLED: "true"
  BITCOIN_RPC_REQUIRED: "true"
  BITCOIN_RPC_PRUNED_REQUIRED: "false"
  BITCOIN_RPC_URL: "http://bitcoin-core:8332"
  BITCOIN_RPC_WALLET: "kerosene"
  TRANSACTIONS_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: "true"
  KFE_RECEIVE_BITCOIN_CORE_WALLET_ADDRESS_ENABLED: "true"
  KFE_BITCOIN_CORE_WALLETS_BOOTSTRAP_ENABLED: "true"
  KFE_BITCOIN_VALIDATE_NETWORK_ENABLED: "true"
  KFE_NETWORK_MONITOR_ENABLED: "true"
  KFE_NETWORK_MONITOR_FIXED_DELAY_MS: "15000"
  KFE_NETWORK_MONITOR_INITIAL_DELAY_MS: "10000"
  KFE_NETWORK_MONITOR_ONCHAIN_MIN_CONFIRMATIONS: "1"
  # Faster recipient UX on local testnet: expose inbound at 0-conf, credit available at 1 conf.
  BITCOIN_MIN_CONFIRMATIONS: "1"
  KFE_CUSTODIAL_DEPOSIT_OBSERVATION_MIN_CONFIRMATIONS: "0"
  KFE_CUSTODIAL_DEPOSIT_OBSERVATION_FIXED_DELAY_MS: "1500"
  KFE_PAYMENT_REQUEST_MONITOR_ONCHAIN_MIN_CONFIRMATIONS: "0"
  KFE_PAYMENT_REQUEST_MONITOR_FIXED_DELAY_MS: "3000"
  KFE_PAYMENT_REQUEST_MONITOR_INITIAL_DELAY_MS: "2000"
  BITCOIN_ZMQ_ENABLED: "true"
  BITCOIN_ZMQ_RAWTX: "tcp://bitcoin-core:28333"
  BITCOIN_ZMQ_HASHBLOCK: "tcp://bitcoin-core:28332"
  REGION: "LOCAL"
  APP_CORS_ALLOWED_ORIGINS: "http://placeholder.onion"
  WEBAUTHN_ORIGINS: "android:apk-key-hash:kerosene,http://placeholder.onion"
  AUDIT_SOLVENCY_ENFORCED: "false"
  RELEASE_ATTESTATION_REQUIRED: "false"
  RELEASE_REMOTE_ATTESTATION_ENABLED: "false"
  QUORUM_ALLOW_LOCAL_SIMULATION: "true"
  # On-chain outbound: local Bitcoin Core is a first-class PSBT signer seat (walletprocesspsbt).
  # Mesh-only: Taproot PSBT signing via vault mesh (no local-core / mpc fallback).
  # Fund the mesh deposit address from GET /v1/bitcoin/deposit (tr() watch-only).
  QUORUM_PSBT_LOCAL_CORE_SIGNER_ENABLED: "false"
  QUORUM_PSBT_REQUIRED_SIGNATURES: "1"
  QUORUM_PSBT_REQUIRE_SIGNER_IDENTITY: "false"
  KFE_MPC_SIGNING_ENABLED: "false"
  # Beta onramp directory only — third-party links, Kerosene does not process fiat.
  # Keys map to provider aliases in the Flutter receive gateway (moonpay, transak, …)
  # plus generic buy/sell/help.
  KFE_ONRAMP_URL_BUY: "https://www.bitcoin.com/get-started/how-to-buy-bitcoin/"
  KFE_ONRAMP_URL_SELL: "https://www.bitcoin.com/get-started/how-to-sell-bitcoin/"
  KFE_ONRAMP_URL_HELP: "https://bitcoin.org/en/exchanges"
  KFE_ONRAMP_URL_MOONPAY: "https://www.moonpay.com/buy/btc"
  KFE_ONRAMP_URL_TRANSAK: "https://global.transak.com/"
  KFE_ONRAMP_URL_ONRAMPER: "https://www.onramper.com/"
