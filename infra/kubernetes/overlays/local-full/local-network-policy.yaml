# Local-full intentionally relaxes namespace-internal traffic so the developer
# stack can boot without carrying production service-mesh assumptions into a
# single-node workstation cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-full-allow-namespace-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-full-allow-debug-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - server
          - web-page
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
---
# kfe → host-published vault-mesh-lab (:7701) via Service/Endpoints bridge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-full-allow-vault-mesh-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kfe-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 7701
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-full-allow-bitcoin-testnet-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitcoin-core
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        # Classic testnet (testnet3) default P2P; local bitcoind also binds 8333.
        - protocol: TCP
          port: 18333
        - protocol: TCP
          port: 8333
