apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
  namespace: spire-system
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server.spire-server.svc"
      server_port = "8081"
      socket_path = "/run/spire/sockets/spire-agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "staging.kerosene.internal"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "kerosene-staging"
          token_path = "/var/run/secrets/tokens/spire-agent"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          kubelet_secure_port = 10250
          kubelet_ca_path = "/var/run/secrets/kubelet-ca/ca.crt"
          token_path = "/var/run/secrets/kubelet/token"
          node_name_env = "MY_NODE_NAME"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.spiffe.io
spec:
  attachRequired: false
  podInfoOnMount: true
  fsGroupPolicy: None
  volumeLifecycleModes: ["Ephemeral"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-agent
    app.kubernetes.io/component: identity-node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent
        app.kubernetes.io/component: identity-node-agent
    spec:
      serviceAccountName: spire-agent
      automountServiceAccountToken: false
      hostPID: true
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent@sha256:1d042e4040466686e0ee46f74981ff2167c86adfadca19b3835946f4d6047536
          imagePullPolicy: IfNotPresent
          args: ["-config", "/run/spire/config/agent.conf"]
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: psat-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - name: kubelet-token
              mountPath: /var/run/secrets/kubelet
              readOnly: true
            - name: kubelet-ca
              mountPath: /var/run/secrets/kubelet-ca
              readOnly: true
            - name: agent-data
              mountPath: /run/spire/data
            - name: agent-socket
              mountPath: /run/spire/sockets
        - name: spiffe-csi-driver
          image: ghcr.io/spiffe/spiffe-csi-driver@sha256:6f1ba5d635ba9bf55ae69ba11d71bf169c8fa3e0139a5063738cbc227c8b5546
          imagePullPolicy: IfNotPresent
          args:
            - -workload-api-socket-dir=/spire-agent-socket
            - -csi-socket-path=/spiffe-csi/csi.sock
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: agent-socket
              mountPath: /spire-agent-socket
              readOnly: true
            - name: csi-socket
              mountPath: /spiffe-csi
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar@sha256:11f199f6bec47403b03cb49c79a41f445884b213b382582a60710b8c6fdc316a
          imagePullPolicy: IfNotPresent
          args:
            - -csi-address=/spiffe-csi/csi.sock
            - -kubelet-registration-path=/var/lib/kubelet/plugins/csi.spiffe.io/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: csi-socket
              mountPath: /spiffe-csi
            - name: kubelet-registration
              mountPath: /registration
      volumes:
        - name: config
          configMap:
            name: spire-agent-config
        - name: bundle
          configMap:
            name: spire-bundle
        - name: psat-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  audience: spire-server
                  expirationSeconds: 3600
        - name: kubelet-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        - name: kubelet-ca
          configMap:
            name: kube-root-ca.crt
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: agent-data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: csi-socket
          hostPath:
            path: /var/lib/kubelet/plugins/csi.spiffe.io
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: kubelet-registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
