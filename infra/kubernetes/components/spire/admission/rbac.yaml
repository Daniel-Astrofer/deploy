apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kerosene-deployer
  namespace: kerosene-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "serviceaccounts", "services"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["create", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kerosene-deployer
  namespace: kerosene-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kerosene-deployer
subjects:
  - kind: ServiceAccount
    name: kerosene-deployer
    namespace: kerosene-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kerosene-deployer
  namespace: kerosene-staging-vault
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "serviceaccounts", "services"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["create", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kerosene-deployer
  namespace: kerosene-staging-vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kerosene-deployer
subjects:
  - kind: ServiceAccount
    name: kerosene-deployer
    namespace: kerosene-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kerosene-deployer-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kerosene-staging", "kerosene-staging-vault"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kerosene-deployer-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kerosene-deployer-namespaces
subjects:
  - kind: ServiceAccount
    name: kerosene-deployer
    namespace: kerosene-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kerosene-deployer-spiffe-registrations
rules:
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kerosene-deployer-spiffe-registrations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kerosene-deployer-spiffe-registrations
subjects:
  - kind: ServiceAccount
    name: kerosene-deployer
    namespace: kerosene-gitops
