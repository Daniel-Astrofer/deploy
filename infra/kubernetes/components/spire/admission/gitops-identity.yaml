apiVersion: v1
kind: Namespace
metadata:
  name: kerosene-gitops
  labels:
    app.kubernetes.io/name: kerosene-gitops
    app.kubernetes.io/part-of: kerosene
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kerosene-deployer
  namespace: kerosene-gitops
automountServiceAccountToken: false
