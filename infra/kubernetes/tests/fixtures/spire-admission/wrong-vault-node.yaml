apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: kerosene-staging-vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        kerosene.io/spiffe-role: vault
        vault.kerosene.io/node-id: attacker
    spec:
      serviceAccountName: vault
      automountServiceAccountToken: false
      containers:
        - name: vault
          image: registry.example/kerosene-vault@sha256:3333333333333333333333333333333333333333333333333333333333333333
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
