apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-tor
  namespace: kerosene-staging
spec:
  serviceName: staging-tor
  selector:
    matchLabels:
      app.kubernetes.io/name: staging-tor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: staging-tor
        kerosene.io/spiffe-role: node
        kerosene.io/discovery-plane: bank
    spec:
      serviceAccountName: kerosene-node
      automountServiceAccountToken: false
      initContainers:
        - name: fix-tor-permissions
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      containers:
        - name: tor
          image: registry.example/kerosene-tor@sha256:4444444444444444444444444444444444444444444444444444444444444444
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
        - name: kerosene-node
          image: registry.example/kerosene-node@sha256:5555555555555555555555555555555555555555555555555555555555555555
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
