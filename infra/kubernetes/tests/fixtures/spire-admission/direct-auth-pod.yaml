apiVersion: v1
kind: Pod
metadata:
  name: direct-auth
  namespace: kerosene-staging
  labels:
    kerosene.io/spiffe-role: auth
spec:
  serviceAccountName: server
  automountServiceAccountToken: false
  containers:
    - name: server
      image: registry.example/kerosene-core@sha256:1111111111111111111111111111111111111111111111111111111111111111
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /run/spire/sockets
          readOnly: true
  volumes:
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
