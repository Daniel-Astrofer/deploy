apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: vault-mesh
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /v1/metrics
    prometheus.io/port: "7801"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: http
      port: 7801
      targetPort: http
      protocol: TCP
