# Kerosene image contract.
#
# This file is Deploy's packaging inventory for image names, local tags,
# Dockerfiles and external build contexts. It does not define source ownership.
#
# dockerfile points to a Deploy-owned packaging recipe. Service implementation
# remains in context_repository and must never be copied into this repository.

images:
  server:
    image: kerosene/server
    local_tag: local
    dockerfile: infra/docker/images/server/Dockerfile
    context_repository: core
    context: .
    owner: backend

  kfe-service:
    image: kerosene/kfe-service
    local_tag: local
    dockerfile: infra/docker/images/kfe-service/Dockerfile
    context_repository: kfe
    context: .
    owner: kfe

  kerosene-vault:
    image: kerosene/kerosene-vault
    local_tag: local
    dockerfile: infra/docker/images/kerosene-vault/Dockerfile
    context_repository: vault
    context: .
    owner: vault-mesh
    notes: >-
      Vault mesh node (Rust). Lab uses ATTESTATION_MODE=sim; production builds
      must refuse sim (KEROSENE_VAULT_REFUSE_SIM / feature production).

  kerosene-node:
    image: kerosene/node
    local_tag: local
    dockerfile: infra/docker/images/kerosene-node/Dockerfile
    context_repository: node
    context: .
    owner: discovery

  kerosene-rsctl:
    image: kerosene/rsctl
    local_tag: local
    dockerfile: infra/docker/images/kerosene-rsctl/Dockerfile
    context_repository: node
    context: .
    owner: operations
    notes: >-
      Ephemeral operator image. It is not installed in Node or Vault service
      images and carries no credentials.

  kerosene-jctl:
    image: kerosene/jctl
    local_tag: local
    dockerfile: infra/docker/images/kerosene-jctl/Dockerfile
    context_repository: admin
    context: .
    owner: operations
    notes: >-
      Ephemeral operator image. Credentials are mounted or obtained at runtime,
      never copied into this image.

  tor:
    image: kerosene/tor
    local_tag: local
    dockerfile: infra/docker/images/tor/Dockerfile
    context_repository: deploy
    context: infra/runtime/tor
    owner: network

  web-page:
    image: kerosene/web-page
    local_tag: local
    dockerfile: infra/docker/images/web-page/Dockerfile
    context_repository: generated
    context: .
    owner: frontend
    notes: >-
      The web-page Kubernetes image now has a canonical Dockerfile. Legacy
      scripts may still keep fallback behavior during the migration window.
