# Gate visualize: production-grade binary flags on a private LAN (published ports).
# Lab ≠ go-live. Real genesis ceremony over Tor = vault-mesh-tor.compose.yaml
# (see backend/kerosene-vault/docs/CEREMONY_TOR.md).
#
# This profile uses ceremony_mode=staging + clearnet so LAN Gate visualize still boots.
# Production checklist (`VAULT_CEREMONY_MODE=production`) requires Tor + onion peers and
# refuses VAULT_CLEARNET_PUBLISH — use vault-mesh-tor (or host Tor) for go-live.
#
# LAN Gate visualize:
#   infra/scripts/gen-ceremony-mtls.sh   # unique SPIFFE + audit keys → ceremony-certs/
#   VAULT_DATA_PASSPHRASE=... docker compose -f infra/docker/compose/vault-mesh-ceremony.compose.yaml up --build
#   VAULT_AUTH_MODE=mtls ... ./scripts/vault/genesis_dkg_wire.sh
#
# Real Tor ceremony:
#   ./scripts/vault/lab_dkg_wire_tor.sh
#   VAULT_CEREMONY_MODE=production VAULT_TRANSPORT=tor VAULT_SOCKS_PROXY=... \
#     VAULT_SEED_PEERS='...onion...' ./scripts/vault/genesis_ceremony_checklist.sh
#
# Mixed SEV-priority: VAULT_PEER_TIERS=vault-epyc=sev. Never ATTESTATION_STAGING_STUB=1 for prod.
# Certs: gen_ceremony_mtls_certs.sh (unique SPIFFE) or gen_lab_mtls_certs.sh for Gate;
# ops SPIRE drop-in uses same URI layout (MTLS_SPIFFE_LAYOUT.md). Audit keys: gen_mesh_audit_keys.sh.

x-vault-ceremony-env: &vault-ceremony-env
  BITCOIN_NETWORK: testnet3
  KEROSENE_ENV: staging
  VAULT_CEREMONY_MODE: staging
  VAULT_DKG_MODE: distributed_wire
  VAULT_NODE_TIER: domestic
  ATTESTATION_MODE: software
  VAULT_SHARE_STORE: aead_disk
  VAULT_AUTH_MODE: mtls
  # LAN Gate visualize only — production go-live uses VAULT_TRANSPORT=tor (vault-mesh-tor).
  VAULT_TRANSPORT: clearnet
  VAULT_LISTEN_ADDR: 0.0.0.0:7701
  VAULT_GENESIS_N: "3"
  VAULT_DATA_DIR: /var/lib/kerosene-vault
  VAULT_DATA_PASSPHRASE: ${VAULT_DATA_PASSPHRASE:?set VAULT_DATA_PASSPHRASE}
  LAB_ATTESTATION_ROOT: kerosene-ceremony-root
  VAULT_MTLS_TRUST_DOMAIN: ${VAULT_MTLS_TRUST_DOMAIN:-kerosene.ceremony}
  # Per-node SPIFFE allowlist (unique). Override after gen_ceremony_mtls_certs.sh.
  VAULT_TLS_PEER_SPIFFE_ID: ${VAULT_TLS_PEER_SPIFFE_ID:-spiffe://kerosene.ceremony/vault/vault-1,spiffe://kerosene.ceremony/vault/vault-2,spiffe://kerosene.ceremony/vault/vault-3}
  VAULT_TLS_CERT_PATH: ${VAULT_TLS_CERT_PATH:-/certs/server.crt}
  VAULT_TLS_KEY_PATH: ${VAULT_TLS_KEY_PATH:-/certs/server.key}
  VAULT_TLS_CLIENT_CA_PATH: ${VAULT_TLS_CLIENT_CA_PATH:-/ca/ca.crt}
  VAULT_TLS_CLIENT_CERT_PATH: ${VAULT_TLS_CLIENT_CERT_PATH:-/certs/client.crt}
  VAULT_TLS_CLIENT_KEY_PATH: ${VAULT_TLS_CLIENT_KEY_PATH:-/certs/client.key}
  VAULT_AUDIT_PUBKEYS_PATH: ${VAULT_AUDIT_PUBKEYS_PATH:-/audit/allowlist.txt}

services:
  vault-1:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ${KEROSENE_DEPLOY_DIR:?set KEROSENE_DEPLOY_DIR}/infra/docker/images/kerosene-vault/Dockerfile
      args:
        CARGO_FEATURES: production
    container_name: kerosene-vault-1-ceremony
    environment:
      <<: *vault-ceremony-env
      VAULT_NODE_ID: vault-1
      VAULT_SEED_PEERS: vault-2=vault-2:7701,vault-3=vault-3:7701
    volumes:
      - vault-1-ceremony-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/nodes/vault-1:/certs:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/ca.crt:/ca/ca.crt:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/audit:/audit:ro
    ports:
      - "7701:7701"

  vault-2:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ${KEROSENE_DEPLOY_DIR:?set KEROSENE_DEPLOY_DIR}/infra/docker/images/kerosene-vault/Dockerfile
      args:
        CARGO_FEATURES: production
    container_name: kerosene-vault-2-ceremony
    environment:
      <<: *vault-ceremony-env
      VAULT_NODE_ID: vault-2
      VAULT_SEED_PEERS: vault-1=vault-1:7701,vault-3=vault-3:7701
    volumes:
      - vault-2-ceremony-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/nodes/vault-2:/certs:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/ca.crt:/ca/ca.crt:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/audit:/audit:ro
    ports:
      - "7702:7701"

  vault-3:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ${KEROSENE_DEPLOY_DIR:?set KEROSENE_DEPLOY_DIR}/infra/docker/images/kerosene-vault/Dockerfile
      args:
        CARGO_FEATURES: production
    container_name: kerosene-vault-3-ceremony
    environment:
      <<: *vault-ceremony-env
      VAULT_NODE_ID: vault-3
      VAULT_SEED_PEERS: vault-1=vault-1:7701,vault-2=vault-2:7701
    volumes:
      - vault-3-ceremony-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/nodes/vault-3:/certs:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/ca.crt:/ca/ca.crt:ro
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/ceremony-certs/audit:/audit:ro
    ports:
      - "7703:7701"

volumes:
  vault-1-ceremony-data:
  vault-2-ceremony-data:
  vault-3-ceremony-data:
