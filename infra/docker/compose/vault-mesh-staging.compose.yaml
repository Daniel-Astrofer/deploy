# Staging mesh: TEE path exercise (SEV stub by default) — no ATTESTATION_MODE=sim, no LAB_TIMELOCK_SCALE (F8).
# testnet3 only until Production Gate + explicit mainnet flag.
# Real HW SEV: set ATTESTATION_STAGING_STUB=0 and provide platform quote plumbing.
#
# Prod operators are mostly domestic PCs (TPM), not EPYC/SEV — see VAULT_MESH_PLAN.md §3.1.
# This compose validates the SEV/staging path; it does NOT mean every ceremony node must be SEV.
# Native ceremony may be all-domestic; SEV nodes get seating priority when present.
#
# Lab-only defaults below are for local staging visualization — NOT production go-live.
# Staging must NOT set VAULT_DKG_MODE=dealer_lab (production-path refuse).
#
# --- mTLS end-to-end (default) ---
# 1) Materialize certs (SPIFFE-like layout under lab-certs/spiffe/):
#      ./scripts/vault/gen_lab_mtls_certs.sh
#    Short-lived leaf rotation (reuses CA):
#      VAULT_LAB_MTLS_TTL_HOURS=24 ./scripts/vault/rotate_lab_mtls_certs.sh
#    Docs: backend/kerosene-vault/docs/MTLS_SPIFFE_LAYOUT.md
# 2) Bring up mesh (HTTPS + client cert required):
#      docker compose -f infra/docker/compose/vault-mesh-staging.compose.yaml up --build
# 3) Point kfe at vault with client TLS (go-live props):
#      --spring.config.additional-location=classpath:kfe-service-vaultmesh-go-live.properties
#    Props (env overrides):
#      KFE_VAULTMESH_BASE_URL=https://127.0.0.1:7701
#      KFE_VAULTMESH_TLS_ENABLED=true
#      KFE_VAULTMESH_TLS_CERT_PATH=.../lab-certs/vault-client.crt
#      KFE_VAULTMESH_TLS_KEY_PATH=.../lab-certs/vault-client.pkcs8.key
#      KFE_VAULTMESH_TLS_CA_PATH=.../lab-certs/ca.crt
#    Or PKCS12:
#      KFE_VAULTMESH_TLS_KEYSTORE_PATH=.../lab-certs/kfe-client.p12
#      KFE_VAULTMESH_TLS_TRUSTSTORE_PATH=.../lab-certs/truststore.p12
#      KFE_VAULTMESH_TLS_KEYSTORE_PASSWORD=changeit
#      KFE_VAULTMESH_TLS_TRUSTSTORE_PASSWORD=changeit
#    Do not set KFE_VAULTMESH_API_TOKEN under mTLS (vault refuses X-Vault-Token).
# 4) Smoke (client cert):
#      curl --cert lab-certs/vault-client.crt --key lab-certs/vault-client.key \
#           --cacert lab-certs/ca.crt https://127.0.0.1:7701/v1/health

x-vault-staging-env: &vault-staging-env
  BITCOIN_NETWORK: testnet3
  KEROSENE_ENV: staging
  VAULT_CEREMONY_MODE: staging
  VAULT_NODE_TIER: sev
  ATTESTATION_MODE: sev
  ATTESTATION_STAGING_STUB: "1"
  LAB_ATTESTATION_ROOT: kerosene-staging-root
  VAULT_LISTEN_ADDR: 0.0.0.0:7701
  VAULT_GENESIS_N: "3"
  VAULT_DATA_DIR: /var/lib/kerosene-vault
  VAULT_SHARE_STORE: tee_seal
  VAULT_DKG_MODE: distributed_wire
  # Staging hygiene refuses static_token; default toward mTLS.
  VAULT_AUTH_MODE: ${VAULT_AUTH_MODE:-mtls}
  VAULT_API_TOKEN: ${VAULT_API_TOKEN:-}
  VAULT_DATA_PASSPHRASE: ${VAULT_DATA_PASSPHRASE:-}
  VAULT_TLS_CERT_PATH: ${VAULT_TLS_CERT_PATH:-/certs/vault-server.crt}
  VAULT_TLS_KEY_PATH: ${VAULT_TLS_KEY_PATH:-/certs/vault-server.key}
  VAULT_TLS_CLIENT_CA_PATH: ${VAULT_TLS_CLIENT_CA_PATH:-/certs/ca.crt}
  VAULT_TLS_CLIENT_CERT_PATH: ${VAULT_TLS_CLIENT_CERT_PATH:-/certs/vault-client.crt}
  VAULT_TLS_CLIENT_KEY_PATH: ${VAULT_TLS_CLIENT_KEY_PATH:-/certs/vault-client.key}

services:
  # Init container: generate staging mTLS certs before vaults start
  staging-cert-init:
    image: alpine:3.20
    container_name: kerosene-vault-staging-cert-init
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssl > /dev/null 2>&1
        if [ ! -f /certs/ca.crt ]; then
          echo "[cert-init] Generating staging mTLS certs..."
          # CA
          openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
            -keyout /certs/ca.key -out /certs/ca.crt \
            -subj "/CN=kerosene-staging-ca/O=Kerosene/C=BR"
          # Vault server cert
          openssl req -newkey rsa:2048 -sha256 -nodes -keyout /certs/vault-server.key \
            -out /tmp/vault-server.csr -subj "/CN=kerosene-vault-staging/O=Kerosene/C=BR"
          printf '%s\n' \
            'subjectAltName=DNS:localhost,DNS:vault-1,DNS:vault-2,DNS:vault-3,IP:127.0.0.1,URI:spiffe://kerosene.lab/vault/server' \
            'keyUsage=digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth,clientAuth' > /tmp/srv.ext
          openssl x509 -req -in /tmp/vault-server.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
            -CAcreateserial -out /certs/vault-server.crt -days 365 -sha256 -extfile /tmp/srv.ext
          # Vault client cert
          openssl req -newkey rsa:2048 -sha256 -nodes -keyout /certs/vault-client.key \
            -out /tmp/vault-client.csr -subj "/CN=kerosene-kfe-staging/O=Kerosene/C=BR"
          printf '%s\n' \
            'subjectAltName=URI:spiffe://kerosene.lab/kfe' \
            'keyUsage=digitalSignature,keyEncipherment' \
            'extendedKeyUsage=clientAuth' > /tmp/cli.ext
          openssl x509 -req -in /tmp/vault-client.csr -CA /certs/ca.crt -CAkey /certs/ca.key \
            -CAcreateserial -out /certs/vault-client.crt -days 365 -sha256 -extfile /tmp/cli.ext
          chmod 600 /certs/*.key
          chmod 644 /certs/*.crt
          echo "[cert-init] Staging mTLS certs generated."
        else
          echo "[cert-init] Staging mTLS certs already exist."
        fi
    volumes:
      - lab-certs:/certs
    networks:
      - vault-staging

  vault-1:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-1-staging
    depends_on:
      staging-cert-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-staging-env
      VAULT_NODE_ID: vault-1
      VAULT_SEED_PEERS: vault-2=vault-2:7701,vault-3=vault-3:7701
    volumes:
      - vault-1-staging-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    ports:
      - "7701:7701"

  vault-2:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-2-staging
    depends_on:
      staging-cert-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-staging-env
      VAULT_NODE_ID: vault-2
      VAULT_SEED_PEERS: vault-1=vault-1:7701,vault-3=vault-3:7701
    volumes:
      - vault-2-staging-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    ports:
      - "7702:7701"

  vault-3:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-3-staging
    depends_on:
      staging-cert-init:
        condition: service_completed_successfully
    environment:
      <<: *vault-staging-env
      VAULT_NODE_ID: vault-3
      VAULT_SEED_PEERS: vault-1=vault-1:7701,vault-2=vault-2:7701
    volumes:
      - vault-3-staging-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    ports:
      - "7703:7701"

volumes:
  lab-certs:
  vault-1-staging-data:
  vault-2-staging-data:
  vault-3-staging-data:

networks:
  vault-staging:
    driver: bridge
