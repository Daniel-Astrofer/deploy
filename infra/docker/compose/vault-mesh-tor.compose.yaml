# Private vault mesh over **real Tor** (onion HS + SOCKS outbound).
# NOT the deploy.sh default (that remains vault-mesh-lab clearnet + dealer_lab visualize).
#
# Goals:
#   - VAULT_DKG_MODE=distributed_wire (same production FROST path; no dealer)
#   - Vault API not published on host clearnet
#   - Peers dialed as http://<v3onion>:7701 via socks5h
#   - Longer HTTP timeouts/retries so DKG feels Tor latency/circuit drops
#
# Bring-up (repo root):
#   ./backend/kerosene-vault/scripts/lab_dkg_wire_tor.sh
#
# Or manually:
#   docker compose -f infra/docker/compose/vault-mesh-tor.compose.yaml up --build -d tor-1 tor-2 tor-3
#   # wait for hostname files, export VAULT{1,2,3}_ONION, then up vaults
#
# Lab auth = static_token (Tor variability exercise). Production ceremony = mTLS + Tor
# (see backend/kerosene-vault/docs/CEREMONY_TOR.md). Domestic + SEV seating unchanged.

name: vault-mesh-tor

x-vault-tor-env: &vault-tor-env
  BITCOIN_NETWORK: testnet3
  KEROSENE_ENV: lab
  VAULT_CEREMONY_MODE: lab
  VAULT_TRANSPORT: tor
  VAULT_AUTH_MODE: static_token
  VAULT_DKG_MODE: distributed_wire
  VAULT_API_TOKEN: ${VAULT_API_TOKEN:-kerosene-vault-lab-only}
  VAULT_DATA_PASSPHRASE: ${VAULT_DATA_PASSPHRASE:-kerosene-vault-lab-passphrase}
  VAULT_DATA_DIR: /var/lib/kerosene-vault
  VAULT_NODE_TIER: domestic
  ATTESTATION_MODE: sim
  LAB_ATTESTATION_ROOT: kerosene-tor-lab-root
  VAULT_LISTEN_ADDR: 0.0.0.0:7701
  VAULT_GENESIS_N: "3"
  VAULT_HTTP_TIMEOUT_SECS: "180"
  VAULT_HTTP_CONNECT_TIMEOUT_SECS: "60"
  VAULT_HTTP_MAX_RETRIES: "5"
  VAULT_HTTP_RETRY_BASE_MS: "750"
  VAULT_HTTP_RETRY_JITTER_MS: "750"
  # Never set VAULT_CLEARNET_PUBLISH=1 here.

x-tor-image: &tor-image
  image: kerosene/tor:local
  build:
    context: ../../../infra/runtime/tor
    dockerfile: ../../../infra/docker/images/tor/Dockerfile

networks:
  vault-private:
    # Vaults talk only to their Tor sidecar on this net (no host port publish).
    driver: bridge
  tor-egress:
    # Tor daemons need Internet egress for real circuits.
    driver: bridge

services:
  tor-1:
    <<: *tor-image
    container_name: kerosene-vault-tor-1
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-1:/etc/tor/torrc:ro
      - tor-1-data:/var/lib/tor
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19051:9050"

  tor-2:
    <<: *tor-image
    container_name: kerosene-vault-tor-2
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-2:/etc/tor/torrc:ro
      - tor-2-data:/var/lib/tor
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19052:9050"

  tor-3:
    <<: *tor-image
    container_name: kerosene-vault-tor-3
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-3:/etc/tor/torrc:ro
      - tor-3-data:/var/lib/tor
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19053:9050"

  vault-1:
    build:
      context: ../../../backend/kerosene-vault
      dockerfile: ../../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-1-tor
    depends_on:
      - tor-1
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-1
      VAULT_SOCKS_PROXY: socks5h://tor-1:9050
      # Filled by lab_dkg_wire_tor.sh after onion discovery (compose variable substitution).
      VAULT_SEED_PEERS: vault-2=http://${VAULT2_ONION:?set VAULT2_ONION}:7701,vault-3=http://${VAULT3_ONION:?set VAULT3_ONION}:7701
    volumes:
      - vault-1-tor-data:/var/lib/kerosene-vault
    networks:
      - vault-private
    # Intentionally no host ports — private mesh only.

  vault-2:
    build:
      context: ../../../backend/kerosene-vault
      dockerfile: ../../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-2-tor
    depends_on:
      - tor-2
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-2
      VAULT_SOCKS_PROXY: socks5h://tor-2:9050
      VAULT_SEED_PEERS: vault-1=http://${VAULT1_ONION:?set VAULT1_ONION}:7701,vault-3=http://${VAULT3_ONION:?set VAULT3_ONION}:7701
    volumes:
      - vault-2-tor-data:/var/lib/kerosene-vault
    networks:
      - vault-private

  vault-3:
    build:
      context: ../../../backend/kerosene-vault
      dockerfile: ../../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-3-tor
    depends_on:
      - tor-3
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-3
      VAULT_SOCKS_PROXY: socks5h://tor-3:9050
      VAULT_SEED_PEERS: vault-1=http://${VAULT1_ONION:?set VAULT1_ONION}:7701,vault-2=http://${VAULT2_ONION:?set VAULT2_ONION}:7701
    volumes:
      - vault-3-tor-data:/var/lib/kerosene-vault
    networks:
      - vault-private

volumes:
  tor-1-data:
  tor-2-data:
  tor-3-data:
  vault-1-tor-data:
  vault-2-tor-data:
  vault-3-tor-data:
