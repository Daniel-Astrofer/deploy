# Private vault mesh over **real Tor** (onion HS + SOCKS outbound).
# Deploy default remains vault-mesh-lab (clearnet + dealer_lab). Opt in:
#   KEROSENE_VAULT_MESH_PROFILE=tor bash infra/deploy.sh
#   KEROSENE_VAULT_MESH_PROFILE=tor bash infra/kubernetes/scripts/ensure-vault-mesh-lab.sh
#
# Goals:
#   - VAULT_DKG_MODE=distributed_wire (same production FROST path; no dealer)
#   - Vault API not published on host clearnet
#   - Peers dialed as https://<v3onion>:7701 via socks5h (mTLS) or http://… (lab token smoke)
#   - Longer HTTP timeouts/retries so DKG feels Tor latency/circuit drops
#
# Auth profiles (env):
#   Lab variability smoke (default): VAULT_AUTH_MODE=static_token
#   Ceremony / staging / production path:
#     VAULT_AUTH_MODE=mtls + lab-certs; peer verify = onion_or_spiffe (SPIFFE URI or .onion SAN)
#     VAULT_AUTH_MODE=mtls ./scripts/vault/lab_dkg_wire_tor.sh
#
# Docs: backend/kerosene-vault/docs/CEREMONY_TOR.md + MTLS_SPIFFE_LAYOUT.md

name: vault-mesh-tor

x-vault-tor-env: &vault-tor-env
  BITCOIN_NETWORK: testnet3
  KEROSENE_ENV: ${KEROSENE_ENV:-lab}
  VAULT_CEREMONY_MODE: ${VAULT_CEREMONY_MODE:-lab}
  VAULT_TRANSPORT: tor
  # Lab smoke default = static_token. Ceremony: VAULT_AUTH_MODE=mtls (staging/prod refuse token).
  VAULT_AUTH_MODE: ${VAULT_AUTH_MODE:-static_token}
  VAULT_DKG_MODE: distributed_wire
  VAULT_API_TOKEN: ${VAULT_API_TOKEN:-kerosene-vault-lab-only}
  VAULT_DATA_PASSPHRASE: ${VAULT_DATA_PASSPHRASE:-kerosene-vault-lab-passphrase}
  VAULT_DATA_DIR: /var/lib/kerosene-vault
  VAULT_NODE_TIER: domestic
  ATTESTATION_MODE: ${ATTESTATION_MODE:-sim}
  LAB_ATTESTATION_ROOT: kerosene-tor-lab-root
  VAULT_LISTEN_ADDR: 0.0.0.0:7701
  VAULT_GENESIS_N: "3"
  VAULT_HTTP_TIMEOUT_SECS: "180"
  VAULT_HTTP_CONNECT_TIMEOUT_SECS: "60"
  VAULT_HTTP_MAX_RETRIES: "5"
  VAULT_HTTP_RETRY_BASE_MS: "750"
  VAULT_HTTP_RETRY_JITTER_MS: "750"
  VAULT_TLS_VERIFY_MODE: ${VAULT_TLS_VERIFY_MODE:-onion_or_spiffe}
  VAULT_TLS_PEER_SPIFFE_ID: ${VAULT_TLS_PEER_SPIFFE_ID:-spiffe://kerosene.lab/vault/server}
  VAULT_TLS_CERT_PATH: ${VAULT_TLS_CERT_PATH:-/certs/vault-server.crt}
  VAULT_TLS_KEY_PATH: ${VAULT_TLS_KEY_PATH:-/certs/vault-server.key}
  VAULT_TLS_CLIENT_CA_PATH: ${VAULT_TLS_CLIENT_CA_PATH:-/certs/ca.crt}
  VAULT_TLS_CLIENT_CERT_PATH: ${VAULT_TLS_CLIENT_CERT_PATH:-/certs/vault-client.crt}
  VAULT_TLS_CLIENT_KEY_PATH: ${VAULT_TLS_CLIENT_KEY_PATH:-/certs/vault-client.key}
  # Never set VAULT_CLEARNET_PUBLISH=1 here.

x-tor-image: &tor-image
  image: kerosene/tor:local
  build:
    context: ../../../infra/runtime/tor
    dockerfile: ../../../infra/docker/images/tor/Dockerfile

networks:
  vault-private:
    driver: bridge
  tor-egress:
    driver: bridge

services:
  tor-1:
    <<: *tor-image
    container_name: kerosene-vault-tor-1
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-1:/etc/tor/torrc:ro
      - tor-1-data:/var/lib/tor
      - ../../../infra/runtime/tor/authorized_clients:/var/lib/tor/kerosene_service/authorized_clients:ro
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19051:9050"

  tor-2:
    <<: *tor-image
    container_name: kerosene-vault-tor-2
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-2:/etc/tor/torrc:ro
      - tor-2-data:/var/lib/tor
      - ../../../infra/runtime/tor/authorized_clients:/var/lib/tor/kerosene_service/authorized_clients:ro
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19052:9050"

  tor-3:
    <<: *tor-image
    container_name: kerosene-vault-tor-3
    volumes:
      - ../../../infra/runtime/tor/entrypoint.sh:/entrypoint.sh:ro
      - ../../../infra/runtime/tor/torrc-vault-mesh-3:/etc/tor/torrc:ro
      - tor-3-data:/var/lib/tor
      - ../../../infra/runtime/tor/authorized_clients:/var/lib/tor/kerosene_service/authorized_clients:ro
    networks:
      - vault-private
      - tor-egress
    ports:
      - "127.0.0.1:19053:9050"

  vault-1:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-1-tor
    depends_on:
      - tor-1
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-1
      VAULT_SOCKS_PROXY: socks5h://tor-1:9050
      # Scheme upgraded to https by vault when VAULT_AUTH_MODE=mtls.
      VAULT_SEED_PEERS: vault-2=http://${VAULT2_ONION:?set VAULT2_ONION}:7701,vault-3=http://${VAULT3_ONION:?set VAULT3_ONION}:7701
    volumes:
      - vault-1-tor-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    networks:
      - vault-private

  vault-2:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-2-tor
    depends_on:
      - tor-2
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-2
      VAULT_SOCKS_PROXY: socks5h://tor-2:9050
      VAULT_SEED_PEERS: vault-1=http://${VAULT1_ONION:?set VAULT1_ONION}:7701,vault-3=http://${VAULT3_ONION:?set VAULT3_ONION}:7701
    volumes:
      - vault-2-tor-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    networks:
      - vault-private

  vault-3:
    build:
      context: ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}
      dockerfile: ../../infra/docker/images/kerosene-vault/Dockerfile
    container_name: kerosene-vault-3-tor
    depends_on:
      - tor-3
    environment:
      <<: *vault-tor-env
      VAULT_NODE_ID: vault-3
      VAULT_SOCKS_PROXY: socks5h://tor-3:9050
      VAULT_SEED_PEERS: vault-1=http://${VAULT1_ONION:?set VAULT1_ONION}:7701,vault-2=http://${VAULT2_ONION:?set VAULT2_ONION}:7701
    volumes:
      - vault-3-tor-data:/var/lib/kerosene-vault
      - ${KEROSENE_VAULT_DIR:?set KEROSENE_VAULT_DIR}/lab-certs:/certs:ro
    networks:
      - vault-private

volumes:
  tor-1-data:
  tor-2-data:
  tor-3-data:
  vault-1-tor-data:
  vault-2-tor-data:
  vault-3-tor-data:
